[project]
name = "maas-ua"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "civaschenko", email = "civaschenko@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "defusedxml>=0.7.1,<1",
    "flask>=3.1.3",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
maas-ua = "maas_ua:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["integration: requires an explicit isolated PostgreSQL test server"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
