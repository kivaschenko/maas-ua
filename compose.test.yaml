name: maas-ua-tests

services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: maas_ua_test
      POSTGRES_USER: maas_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maas_test -d maas_ua_test"]
      interval: 1s
      timeout: 5s
      retries: 30
